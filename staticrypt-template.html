<!DOCTYPE html>
<html class="staticrypt-html">
  <head>
    <meta charset="utf-8" />
    <title>/*[|template_title|]*/0</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta http-equiv="cache-control" content="max-age=0" />
    <meta http-equiv="cache-control" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
    <meta http-equiv="pragma" content="no-cache" />

    <link rel="icon" type="image/png" href="./ghost-logo.png" />

    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />

    <style>
      :root {
        --color-foreground: #191919;
        --color-muted: #959593;
        --color-border: #ededec;
        --color-elevated: #f3f3f2;
        --color-control-hover: #ededec;
        --color-background: #ffffff;
        --color-accent: #ef0e22;
      }

      * { box-sizing: border-box; }

      .staticrypt-html, .staticrypt-body {
        height: 100%;
        margin: 0;
      }

      .staticrypt-body {
        background: var(--color-background);
        color: var(--color-foreground);
        font-family: 'Inter var', 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        font-feature-settings: 'cv11', 'ss03';
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      .staticrypt-content {
        height: 100%;
        margin-bottom: 0;
        background: var(--color-background);
        font-family: inherit;
      }

      .staticrypt-page {
        width: 100%;
        max-width: 420px;
        padding: 0 24px;
        margin: 0 auto;
        min-height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .staticrypt-form {
        position: relative;
        z-index: 1;
        background: transparent;
        width: 100%;
        margin: 0 auto;
        padding: 0;
        text-align: left;
        box-shadow: none;
      }

      .staticrypt-logo {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 32px;
      }

      .staticrypt-logo img {
        width: 24px;
        height: 24px;
        object-fit: contain;
      }

      .staticrypt-logo-name {
        font-family: 'Times New Roman', Georgia, serif;
        font-size: 17px;
        letter-spacing: -0.01em;
        color: var(--color-foreground);
      }

      .staticrypt-instructions {
        margin: 0 0 28px;
      }

      .staticrypt-title {
        font-family: 'Times New Roman', Georgia, serif;
        font-weight: 300;
        font-size: 44px;
        line-height: 1;
        letter-spacing: -0.025em;
        color: var(--color-foreground);
        margin: 0 0 12px;
      }

      .staticrypt-instructions p:not(.staticrypt-title) {
        font-family: 'Times New Roman', Georgia, serif;
        font-style: italic;
        font-size: 15px;
        line-height: 1.4;
        letter-spacing: -0.02em;
        color: var(--color-muted);
        margin: 0;
      }

      .staticrypt-hr {
        display: none;
      }

      .staticrypt-password-container {
        position: relative;
        outline: 0;
        background: var(--color-elevated);
        width: 100%;
        border: 0;
        border-radius: 2px;
        margin: 0 0 12px;
        box-sizing: border-box;
      }

      .staticrypt-form input[type="password"],
      .staticrypt-form input[type="text"] {
        background: transparent;
        border: 0;
        box-sizing: border-box;
        font-family: inherit;
        font-size: 14px;
        color: var(--color-foreground);
        outline: 0;
        padding: 12px 44px 12px 14px;
        width: 100%;
        height: 44px;
        border-radius: 2px;
      }

      .staticrypt-form input::placeholder {
        color: var(--color-muted);
      }

      .staticrypt-form input:focus {
        box-shadow: inset 0 0 0 1px rgba(25, 25, 25, 0.3);
      }

      .staticrypt-toggle-password-visibility {
        cursor: pointer;
        height: 16px;
        opacity: 0.5;
        padding: 14px;
        position: absolute;
        right: 0;
        top: 50%;
        transform: translateY(-50%);
        width: 16px;
        box-sizing: content-box;
        transition: opacity 150ms;
      }

      .staticrypt-toggle-password-visibility:hover {
        opacity: 0.85;
      }

      .staticrypt-form .staticrypt-decrypt-button {
        font-family: inherit;
        font-weight: 600;
        font-size: 11px;
        line-height: 1;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        outline: 0;
        background: var(--color-foreground);
        width: 100%;
        border: 0;
        border-radius: 2px;
        padding: 14px;
        color: #ffffff;
        cursor: pointer;
        transition: background-color 150ms;
        margin-top: 4px;
      }

      .staticrypt-form .staticrypt-decrypt-button:hover {
        background: #2a2a2a;
      }

      .staticrypt-form .staticrypt-decrypt-button:active,
      .staticrypt-form .staticrypt-decrypt-button:focus {
        background: var(--color-foreground);
      }

      label.staticrypt-remember {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 14px 0;
        font-size: 13px;
        color: var(--color-muted);
        cursor: pointer;
        user-select: none;
      }

      .staticrypt-remember input[type="checkbox"] {
        transform: none;
        margin: 0;
        accent-color: var(--color-foreground);
      }

      .hidden {
        display: none !important;
      }

      .staticrypt-spinner-container {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .staticrypt-spinner {
        display: inline-block;
        width: 1.5rem;
        height: 1.5rem;
        border: 2px solid var(--color-border);
        border-right-color: var(--color-foreground);
        border-radius: 50%;
        animation: spinner-border 0.7s linear infinite;
      }

      @keyframes spinner-border {
        100% { transform: rotate(360deg); }
      }

      @media screen and (-webkit-min-device-pixel-ratio: 0) {
        .staticrypt-form input[type="password"],
        .staticrypt-form input[type="text"] {
          font-size: 16px;
        }
      }
    </style>
  </head>

            <span class="staticrypt-logo-name">Shmøergh</span>
          </div>

          <div class="staticrypt-instructions">
            <p class="staticrypt-title">/*[|template_title|]*/0</p>
            <p>/*[|template_instructions|]*/0</p>
          </div>

          <hr class="staticrypt-hr" />

          <form id="staticrypt-form" action="#" method="post">
            <div class="staticrypt-password-container">
              <input
                id="staticrypt-password"
                type="password"
                name="password"
                placeholder="/*[|template_placeholder|]*/0"

              />
            </div>

            <label id="staticrypt-remember-label" class="staticrypt-remember hidden">
              <input id="staticrypt-remember" type="checkbox" name="remember" />
              /*[|template_remember|]*/0
            </label>

            <input type="submit" class="staticrypt-decrypt-button" value="/*[|template_button|]*/0" />
          </form>
        </div>
      </div>
    </div>

    <script>
      const staticryptInitiator = /*[|js_staticrypt|]*/ 0;
      const templateError = "/*[|template_error|]*/0",
        templateToggleAltShow = "/*[|template_toggle_show|]*/0",
        templateToggleAltHide = "/*[|template_toggle_hide|]*/0",
        isRememberEnabled = /*[|is_remember_enabled|]*/ 0,
        staticryptConfig = /*[|staticrypt_config|]*/ 0;

      const templateConfig = {
        rememberExpirationKey: "staticrypt_expiration",
        rememberPassphraseKey: "staticrypt_passphrase",
        replaceHtmlCallback: null,
        clearLocalStorageCallback: null,
      };

      const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

      window.onload = async function () {
        const { isSuccessful } = await staticrypt.handleDecryptOnLoad();

        if (!isSuccessful) {
          document.getElementById("staticrypt_loading").classList.add("hidden");
          document.getElementById("staticrypt_content").classList.remove("hidden");
          document.getElementById("staticrypt-password").focus();

          if (isRememberEnabled) {
            document.getElementById("staticrypt-remember-label").classList.remove("hidden");
          }
        }
      };

      const imgSrcEyeOpened =

      toggleIcon.addEventListener("click", function () {
        const passwordInput = document.getElementById("staticrypt-password");
        if (passwordInput.type === "password") {
          passwordInput.type = "text";
          toggleIcon.src = imgSrcEyeOpened;
          toggleIcon.alt = templateToggleAltHide;
          toggleIcon.title = templateToggleAltHide;
        } else {
          passwordInput.type = "password";
          toggleIcon.src = imgSrcEyeClosed;
          toggleIcon.alt = templateToggleAltShow;
          toggleIcon.title = templateToggleAltShow;
        }
      });

      document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
        e.preventDefault();

        const password = document.getElementById("staticrypt-password").value,
          isRememberChecked = document.getElementById("staticrypt-remember").checked;

        const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);

        if (!isSuccessful) {
          alert(templateError);
        }
      });
    </script>
  </body>
</html>
